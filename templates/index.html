<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TaskPulse To-Do App</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        h1 { color: #1a73e8; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .completed { text-decoration: line-through; color: #888; }
        a { color: #ea4335; text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>TaskPulse To-Do List</h1>
    <form action="/add" method="POST" class="input-group">
        <input type="text" name="title" placeholder="할 일을 입력하세요..." required>
        <button type="submit">추가</button>
    </form>
    <ul>
        {% for todo in todos %}
        <li>
            <span class="{{ 'completed' if todo.completed }}" onclick="location.href='/toggle/{{ todo.id }}'" style="cursor:pointer;">
                {{ '✅' if todo.completed else '⬜' }} {{ todo.title }}
            </span>
            <a href="/delete/{{ todo.id }}">삭제</a>
        </li>
        {% else %}
        <li>등록된 할 일이 없습니다.</li>
        {% endfor %}
    </ul>
</body>
</html>
